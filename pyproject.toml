[project]
name = "babel"
version = "0.1.0"
description = "Adversarial communication robustness study for cooperative multi-agent reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.0",
    "gymnasium>=1.0.0",
    "hydra-core>=1.3.2",
    "msgpack>=1.1.0",
    "numpy>=2.0.0",
    "pettingzoo>=1.24.3",
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "wandb>=0.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "uv>=0.11.13",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long-running calibration and training checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["babel", "scripts", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
include = ["babel"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
